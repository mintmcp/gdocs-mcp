# Live gdocs-mcp deployments and the PROFILE each runs. A deployment's
# profile is part of its OAuth contract: changing it forces re-consent.
# labels-profile deployments pair with the write-grant gate middleware and
# an approval rule on the Drive connector's set_file_label.

- app: gdocs-mintmcp-labels
  env: prod
  live: false
  profile: labels # standard + drive.labels.readonly
